<!doctype html>
<html lang="en" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f1f5f7">
  <meta name="color-scheme" content="light">
  <meta name="description" content="48: Laws of Power, Design Team Edition. Join a product design team. Swipe to choose. Every decision creates a rival. Every alliance has a price.">
  <title>48: Laws of Power (Design Team Edition)</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="48">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/nunito-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 L5 13.5 H11 L10 21 L19 9.5 H13 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5 L14.6 9 L20.5 9.7 L16.2 13.8 L17.3 19.7 L12 16.8 L6.7 19.7 L7.8 13.8 L3.5 9.7 L9.4 9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20 Q3 13.5 9 13.5 Q15 13.5 15 20" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 13.8 Q21 14 21 19.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 18 L4.5 7 L9 12 L12 5 L15 12 L19.5 7 L21 18 Z M4 20 H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12 Q12 3 22 12 Q12 21 2 12 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-hands" viewBox="0 0 24 24"><path d="M12 20 C5 15 3 11 3 8.5 C3 6 5 4.5 7 4.5 C9 4.5 11 6 12 7.5 C13 6 15 4.5 17 4.5 C19 4.5 21 6 21 8.5 C21 11 19 15 12 20 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5 V16.5 M9.5 10 Q12 8 14.5 10 M9.5 14 Q12 16 14.5 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5 Q8 4 12 6 Q16 4 20 5 V19 Q16 18 12 20 Q8 18 4 19 Z M12 6 V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24"><path d="M9 4H5v16h4M14 8l5 4-5 4M19 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7 H20 M4 12 H20 M4 17 H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20 Q3 13.5 9 13.5 Q15 13.5 15 20" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 13.8 Q21 14 21 19.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6 4 H18 V17 Q18 20 15 20 H6 Q9 20 9 17 V7 Q9 4 6 4 Z M12 9 H15 M12 12 H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12 H21 M18 12 V16 M21 12 V15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <div id="app">
    <!-- Title screen -->
    <main id="screen-title" class="screen title" aria-labelledby="title-h">
      <div class="title-art" aria-hidden="true"></div>
      <div class="title-inner">
        <p class="title-kicker">Design Team Edition</p>
        <h1 id="title-h"><span class="t48"><mark>48</mark></span><span class="tlaws">Laws of Power</span></h1>
        <p class="tagline">Join the design team. Every decision makes a rival. Every alliance has a price.</p>
        <div class="title-menu">
          <button id="btn-continue-reign" class="game-card" data-tag="Your career" data-sub="Pick up where you left off." hidden>Resume career</button>
          <button id="btn-new" class="game-card" data-tag="New career" data-sub="Start as a junior designer at Lumen.">Join the team</button>
          <button id="btn-daily" class="game-card" data-tag="Daily" data-sub="Same office for everyone today.">Play today's office</button>
        </div>
        <nav class="title-nav" aria-label="More">
          <button id="btn-codex" class="nav-btn"><svg aria-hidden="true"><use href="#i-book"/></svg>Playbook</button>
          <button id="btn-settings" class="nav-btn"><svg aria-hidden="true"><use href="#i-gear"/></svg>Settings</button>
          <button id="btn-exit" class="nav-btn"><svg aria-hidden="true"><use href="#i-door"/></svg>Exit</button>
        </nav>
        <p id="title-stats" class="title-stats"></p>
        <p id="title-notice" class="title-notice" role="status" hidden></p>
      </div>
    </main>

    <!-- Game screen -->
    <main id="screen-game" class="screen game" hidden>
      <a class="skip" href="#card">Skip to the card</a>
      <header class="topbar">
        <div class="brand" aria-label="48: Laws of Power"><span class="brand-48">48</span></div>
        <div class="reign-info" id="reign-info"></div>
        <nav class="top-actions" aria-label="Game panels">
          <button class="icon-btn" id="btn-dossier" aria-label="People at work" title="People"><svg><use href="#i-people"/></svg></button>
          <button class="icon-btn" id="btn-chronicle" aria-label="Your choices" title="Your choices"><svg><use href="#i-scroll"/></svg></button>
          <button class="icon-btn" id="btn-menu" aria-label="Pause menu" title="Menu"><svg><use href="#i-menu"/></svg></button>
        </nav>
      </header>
      <div class="weekrow"><div class="weekbar" id="weekbar" role="progressbar" aria-label="Career progress" aria-valuemin="0"><i></i><span class="sr-only" id="week-text"></span></div><button class="debt" id="debt-pill" aria-haspopup="dialog"><span aria-hidden="true">Debt</span> <b id="debt-n">0</b></button><button class="objective-strip" id="objective-btn" aria-haspopup="dialog"></button></div>
      <section class="meters" id="meters" aria-label="Power meters"></section>
      <section class="stage" id="stage">
        <article class="card" id="card" tabindex="-1" aria-labelledby="card-title">
          <div class="lean" id="lean" aria-hidden="true"></div>
          <div class="card-tag tag-left" id="tag-left" aria-hidden="true"></div>
          <div class="card-tag tag-right" id="tag-right" aria-hidden="true"></div>
          <div class="cover" id="card-cover"></div>
          <div class="via-slot" id="card-via"></div>
          <div class="avatar" id="card-avatar"></div>
          <div class="card-body">
            <h2 class="card-title" id="card-title"></h2>
            <p class="card-who"><strong id="card-name"></strong><span id="card-role"></span></p>
            <p class="card-echo" id="card-echo" hidden></p>
            <p class="card-text" id="card-text"></p>
          </div>
        </article>
        <section class="result" id="result" aria-live="polite" hidden></section>
      </section>
      <footer class="actions" id="actions">
        <button class="choice choice-left" id="btn-left"><span class="badge" aria-hidden="true">A</span><span class="choice-text"><span class="choice-label" id="label-left"></span><span class="fx-row" id="fx-left" aria-hidden="true"></span></span></button>
        <button class="choice choice-right" id="btn-right"><span class="badge" aria-hidden="true">B</span><span class="choice-text"><span class="choice-label" id="label-right"></span><span class="fx-row" id="fx-right" aria-hidden="true"></span></span></button>
        <button class="btn primary wide" id="btn-next" hidden>Draw the next card</button>
      </footer>
      <p class="hint" id="hint"></p>
      <div class="vignette" id="vignette" aria-hidden="true"></div>
      <div class="sr-only" id="sr-live" aria-live="polite" aria-atomic="true"></div>
    </main>

    <!-- Summary screen -->
    <main id="screen-summary" class="screen summary" hidden aria-labelledby="sum-title"></main>
  </div>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <div class="dlg-frame">
      <header class="dlg-head">
        <button class="icon-btn dlg-back" id="dlg-back" aria-label="Back" hidden>&#8249;</button>
        <h2 id="dlg-title"></h2>
        <button class="icon-btn" id="dlg-close" aria-label="Close">&#10005;</button>
      </header>
      <div class="dlg-body" id="dlg-body"></div>
      <footer class="dlg-foot" id="dlg-foot" hidden></footer>
    </div>
  </dialog>

  <dialog id="dlg-confirm" aria-labelledby="confirm-title">
    <form method="dialog" class="dlg-frame confirm">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button class="btn" value="cancel" id="confirm-cancel" autofocus>Cancel</button>
        <button class="btn danger" value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
