# Deploys the static game to GitHub Pages. One-time setup: repo Settings > Pages > Source = "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/zen-fermat-sxqa5k, corporate-edition]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The court edition lives at the site root, the corporate edition at /corporate/.
      - uses: actions/checkout@v4
        with: { ref: claude/zen-fermat-sxqa5k, path: court }
      - uses: actions/checkout@v4
        with: { ref: corporate-edition, path: corp }
      - name: Assemble the static site (game files only, no references/tests/tools)
        run: |
          mkdir -p _site/corporate
          (cd court && cp -r index.html manifest.webmanifest sw.js styles js data fonts icons ../_site/)
          (cd corp && cp -r index.html manifest.webmanifest sw.js styles js data fonts icons ../_site/corporate/)
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
